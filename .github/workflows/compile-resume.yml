name: Compile and Publish Resume

on:
  push:
    paths:
      - 'rkulshreshtha_resume*.tex'
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the compiled PDF back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (XeLaTeX & Microsoft Fonts)
        run: |
          sudo apt-get update
          # Automatically accept the EULA for Microsoft core fonts (includes Arial)
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra fontconfig ttf-mscorefonts-installer
          sudo fc-cache -f -v

      - name: Compile LaTeX Documents
        run: |
          # Loop through all matching tex files and compile them twice
          for file in rkulshreshtha_resume*.tex; do
            if [ -f "$file" ]; then
              xelatex "$file"
              xelatex "$file"
            fi
          done

      - name: Commit and push PDFs to 'resume' branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Store commit message from main
          SHORT_MSG=$(git log -1 --pretty=%s)
          
          # Move pdfs outside to avoid being deleted when switching branches
          mkdir -p ../pdfs
          mv rkulshreshtha_resume*.pdf ../pdfs/ 2>/dev/null || true
          
          # Fetch the existing resume branch if it exists
          git fetch origin resume || true
          
          if git branch -a | grep -q "remotes/origin/resume"; then
            # Checkout existing branch to maintain history
            git checkout resume
          else
            # Create branch if it doesn't exist yet
            git checkout --orphan resume
          fi
          
          # Clear the branch of any existing tracked files
          git rm -rf . || true
          
          # Move the compiled PDFs back into the root
          mv ../pdfs/*.pdf . 2>/dev/null || true
          
          # Commit and push the PDFs (maintaining history)
          git add rkulshreshtha_resume*.pdf
          git commit -m "Updated Resume towards '${SHORT_MSG}'" || echo "No changes to commit"
          git push origin resume
