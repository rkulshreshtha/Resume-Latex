name: Compile and Publish Resume

on:
  push:
    paths:
      - 'rkulshreshtha_resume.tex'
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the compiled PDF back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (XeLaTeX & Microsoft Fonts)
        run: |
          sudo apt-get update
          # Automatically accept the EULA for Microsoft core fonts (includes Arial)
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra fontconfig ttf-mscorefonts-installer
          sudo fc-cache -f -v

      - name: Compile LaTeX Document
        run: |
          # Run twice to resolve references and layout properly
          xelatex rkulshreshtha_resume.tex
          xelatex rkulshreshtha_resume.tex

      - name: Commit and push PDF to 'resume' branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Store commit message from main
          SHORT_MSG=$(git log -1 --pretty=%s)
          
          # Move pdf outside to avoid being deleted
          mv rkulshreshtha_resume.pdf ../rkulshreshtha_resume.pdf
          
          # Create or switch to the 'resume' branch
          git checkout --orphan resume
          
          # Clear the branch of all source files
          git rm -rf .
          
          # Move the compiled PDF back into the root
          mv ../rkulshreshtha_resume.pdf .
          
          # Commit and force push the PDF (keeps history clean with 1 commit)
          git add rkulshreshtha_resume.pdf
          git commit -m "Updated Resume towards '${SHORT_MSG}'" || echo "No changes to commit"
          git push origin resume --force
